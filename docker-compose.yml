services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reformapro
      POSTGRES_USER: reformapro
      POSTGRES_PASSWORD: reformapro_dev_password
    ports:
      - "5432:5432"
    volumes:
      - reformapro-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reformapro -d reformapro"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  reformapro-postgres:
